name: Build

on: [pull_request, push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # 5.0.2
        with:
          cache-disabled: true

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # 6.0.1
        with:
          distribution: 'temurin'
          java-version: 21
          check-latest: true

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Check Build Output
        run: |
          echo "Searching generated jars..."
          find . -name "*.jar" -type f || true
          echo "Searching build/libs..."
          find . -type d -name libs || true

      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: Artifacts
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
